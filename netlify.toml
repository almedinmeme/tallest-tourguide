# Netlify build configuration.
# The build MUST be `npm run build` (vite build + prerender): the prerender
# step writes the per-route static HTML, sitemap.xml and the 200.html SPA
# fallback. It exits non-zero if any route fails to prerender correctly, so a
# broken build can never silently ship pages that serve the wrong meta tags.

[build]
  # `npx puppeteer browsers install chrome` first: Netlify restores
  # node_modules from cache, so puppeteer's postinstall (which downloads
  # Chrome) doesn't run — without this the prerender fails with "Could not
  # find Chrome". It's a fast no-op once the browser is in the cache below.
  command = "npx puppeteer browsers install chrome && npm run build"
  publish = "dist"

[functions]
  # /api/availability + /api/submit — the Airtable proxy. Client requests go
  # to /api/*, rewritten to /.netlify/functions/* in public/_redirects.
  # Requires AIRTABLE_TOKEN + AIRTABLE_BASE_ID in the Netlify env.
  directory = "netlify/functions"

[build.environment]
  # Keep the browser inside node_modules so Netlify's dependency cache
  # persists it between builds (the default ~/.cache/puppeteer is not cached).
  PUPPETEER_CACHE_DIR = "/opt/build/repo/node_modules/.cache/puppeteer"
