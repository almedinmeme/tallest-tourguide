<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px;
    background: var(--color-n100);
    font-family: var(--font-body); color: var(--fg-1);
    display: flex; justify-content: center; align-items: flex-start;
  }

  .card {
    width: 360px;
    background: #fff;
    border: 1px solid var(--color-n300);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(13,31,24,0.08);
    text-decoration: none;
    display: flex; flex-direction: column;
  }

  /* media ─────────────────────────── */
  .media { position: relative; aspect-ratio: 4/3; overflow: hidden; }
  .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .media::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,20,15,0) 55%, rgba(10,20,15,0.35) 100%);
    pointer-events: none;
  }
  .badge {
    position: absolute; top: 12px; left: 12px;
    background: var(--color-forest-green); color: #fff;
    font-weight: 700; font-size: 10px;
    letter-spacing: 1.5px; text-transform: uppercase;
    padding: 5px 10px; border-radius: 4px;
    z-index: 2;
  }
  .location {
    position: absolute; bottom: 12px; left: 12px;
    display: inline-flex; align-items: center; gap: 5px;
    color: #fff; font-size: 12px; font-weight: 500;
    z-index: 2;
  }
  .location svg { width: 12px; height: 12px; stroke: var(--color-amber); }

  /* body — everything unified ────── */
  .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px; }

  .row-top {
    display: flex; justify-content: space-between; align-items: center;
  }
  .rating { display: inline-flex; align-items: center; gap: 5px; }
  .rating .star { color: var(--color-amber); font-size: 13px; }
  .rating .score { font-weight: 700; font-size: 13px; color: var(--fg-1); }
  .rating .reviews { font-size: 13px; color: var(--fg-2); }

  .flags { display: inline-flex; gap: 4px; }
  .flag {
    width: 22px; height: 22px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--color-n100); border: 1px solid var(--color-n300);
    font-size: 11px; line-height: 1;
  }

  .title {
    font-family: var(--font-display);
    font-weight: 700; font-size: 20px;
    color: var(--fg-1); margin: 0;
    line-height: 1.3; text-wrap: pretty;
  }
  .desc {
    font-size: 13px; color: var(--fg-2);
    line-height: 1.55; margin: 0;
  }

  .meta {
    display: flex; flex-wrap: wrap; gap: 14px;
    font-size: 13px; color: var(--fg-2);
  }
  .meta span { display: inline-flex; align-items: center; gap: 6px; }
  .meta svg {
    width: 14px; height: 14px;
    stroke: var(--color-forest-green); fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }

  /* bottom — price + CTA together ── */
  .foot {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 14px;
    border-top: 1px solid var(--color-n300);
  }
  .price { display: flex; align-items: baseline; gap: 3px; }
  .price .from { font-size: 11px; color: var(--fg-2); font-weight: 500; margin-right: 4px; text-transform: uppercase; letter-spacing: 1px; }
  .price .big {
    font-family: var(--font-display);
    font-weight: 800; font-size: 22px; color: var(--fg-1); line-height: 1;
  }
  .price .per { font-size: 12px; color: var(--fg-2); }

  .cta {
    display: inline-flex; align-items: center; gap: 7px;
    height: 38px; padding: 0 16px;
    background: var(--color-amber); color: var(--color-n900);
    border-radius: 8px;
    font-weight: 700; font-size: 13px;
    text-decoration: none;
    box-shadow: 0 2px 8px rgba(244,161,48,0.25);
  }
  .cta svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>

<a class="card">
  <div class="media">
    <img src="../assets/tour-2-hero.webp" alt="" />
    <span class="badge">Most Popular</span>
    <span class="location">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 7-8 12-8 12s-8-5-8-12a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
      Mostar · Bosnia
    </span>
  </div>

  <div class="body">
    <div class="row-top">
      <span class="rating">
        <span class="star">★</span>
        <span class="score">4.9</span>
        <span class="reviews">(180 reviews)</span>
      </span>
      <span class="flags">
        <span class="flag">🇬🇧</span>
        <span class="flag">🇩🇪</span>
        <span class="flag">🇫🇷</span>
        <span class="flag">🇮🇹</span>
      </span>
    </div>

    <h3 class="title">Mostar Day Trip from Sarajevo</h3>

    <p class="desc">The Old Bridge, the Neretva canyon, and lunch on the terrace — with a local who grew up here.</p>

    <div class="meta">
      <span>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        10 hours
      </span>
      <span>
        <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>
        Max 8
      </span>
      <span>
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Daily
      </span>
    </div>

    <div class="foot">
      <span class="price">
        <span class="from">From</span>
        <span class="big">€65</span>
        <span class="per">/person</span>
      </span>
      <a class="cta">
        View Tour
        <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
    </div>
  </div>
</a>

</body>
</html>
