<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#2E7D5E" />
    <link rel="alternate" type="application/rss+xml" title="The Journal — Tallest Tourguide" href="/rss.xml" />

    <!-- Preconnect to Google Fonts servers so the connection is ready -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load fonts directly from HTML — avoids the render-blocking CSS @import.
         No opsz axis: nothing in the codebase sets font-optical-sizing, so
         requesting the full 6..72 range cost ~140KB per weight for a range
         that always rendered at its default position anyway. Newsreader 600
         normal is dropped too — it was used only on Checkout.jsx, which now
         falls back to real Newsreader Bold (700) there instead. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400&family=Plus+Jakarta+Sans:wght@400;600;700&family=Inter:wght@400;500&display=swap" />

    <!-- The homepage hero image is preloaded dynamically instead of here —
         its src depends on admin-configured data (src/pages/Home.jsx), so a
         static tag here would silently drift out of sync with what actually
         renders. See SEO.jsx's preloadImage prop. -->

    <!-- Title + all SEO meta (description, canonical, Open Graph, Twitter) is
         managed per-page by react-helmet-async (src/components/SEO.jsx) and
         baked into each route's static HTML by the prerender step
         (scripts/prerender.mjs). Kept out of the static shell so prerendered
         pages have exactly one of each tag, with no stale fallbacks. -->

    <!-- Google Analytics 4 — replace G-XXXXXXXXXX with your Measurement ID -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MZ2RNCEL8Y"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-MZ2RNCEL8Y', { send_page_view: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
